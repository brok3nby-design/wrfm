  <link rel="manifest" href="/wrfm/manifest.webmanifest"><script id="vite-plugin-pwa:register-sw" src="/wrfm/registerSW.js"></script></head>
  <body>
    <script>
      /* Recovery net: if the app bundle or stylesheet fails to load — e.g. a
         stale service worker from a bad deploy is serving an old index.html —
         drop every cache, unregister the worker, and reload once. Runs inline
         so it works even though the app's own JS never executed. */
      (function () {
        window.addEventListener('error', function (e) {
          var t = e.target;
          if (!t || (t.tagName !== 'SCRIPT' && t.tagName !== 'LINK')) return;
          try {
            if (sessionStorage.getItem('wrfm_recovered')) return; // once only
            sessionStorage.setItem('wrfm_recovered', '1');
          } catch (err) { return; }
          var done = function () { location.reload(); };
          var clearCaches = function () {
            if (!window.caches) return Promise.resolve();
            return caches.keys().then(function (keys) {
              return Promise.all(keys.map(function (k) { return caches.delete(k); }));
            });
          };
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations()
              .then(function (rs) { return Promise.all(rs.map(function (r) { return r.unregister(); })); })
              .then(clearCaches).then(done, done);
          } else { clearCaches().then(done, done); }
        }, true);
      })();
    </script>
    <div id="root"></div>
  </body>
